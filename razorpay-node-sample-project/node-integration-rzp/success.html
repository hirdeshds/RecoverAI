<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful — Fine Tshirt</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }
    .card {
      background: #fff;
      border-radius: 18px;
      box-shadow: 0 2px 20px rgba(45, 107, 228, 0.07);
      padding: 52px 48px;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon {
      width: 72px; height: 72px;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      font-size: 34px;
      box-shadow: 0 6px 20px rgba(34, 197, 94, 0.35);
    }
    h1 { font-size: 22px; font-weight: 800; color: #1a2d5a; margin-bottom: 10px; }
    p { font-size: 14px; color: #64748b; line-height: 1.7; margin-bottom: 28px; }
    .btn-back {
      display: inline-block;
      background: #2d6be4;
      color: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 28px;
      border-radius: 7px;
      text-decoration: none;
      transition: background 0.18s, transform 0.15s;
    }
    .btn-back:hover { background: #1a56cc; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Payment Successful!</h1>
    <p>Thank you for your purchase. Your payment has been confirmed and the amount will be auto-refunded to your account in 4–5 days.</p>
    <a href="/" class="btn-back">← Back to Store</a>
  </div>
</body>
</html>
